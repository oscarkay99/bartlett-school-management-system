name: Deploy QA to GitHub Pages

# QA site: published from the `testing` branch only.
on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Demo version (built-in demo data, no sign-in) at /demo, for walkthroughs.
      - name: Build demo site (/demo)
        run: npm run build && mv out out-demo
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/demo
      # Main address: the live school database. Needs the repository secret SUPABASE_ANON_KEY (and QA_LOGINS for the
      # tap-a-role sign-in buttons); without the key it falls back to the demo so the site never breaks.
      - name: Build main site (live database)
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then export NEXT_PUBLIC_DATA_MODE=live; else echo "::warning::SUPABASE_ANON_KEY secret not set: main site built with demo data"; fi
          npm run build
          mv out-demo out/demo
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_QA_LOGINS: ${{ secrets.QA_LOGINS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
